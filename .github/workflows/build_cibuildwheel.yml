name: cibuildwheel

# ENNOVA fork notes
# -----------------
# Builds wheels on every push/PR for verification. On tag push matching v*,
# also creates a GitHub Release and attaches the wheels as assets so
# downstream consumers (e.g. fpFlash) can install via URL without needing
# a C++ toolchain. PyPI publishing is intentionally disabled — ENNOVA
# does not own the `teqp` name on PyPI.
#
# Release workflow:
#   1. Bump version in pyproject.toml
#   2. git tag v0.23.1-ennova.1 && git push --tags
#   3. Wait ~30 min for cibuildwheel to build + attach to GitHub Release
#   4. Update consumer pyproject URLs to point at the new release

on:
  pull_request:
  push:
    branches: [main, jog-chapman-polar]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-13, macos-14]

    steps:
      - uses: actions/checkout@v5
      - name: checkout submodules
        run: git submodule update --init --recursive

      # Used to host cibuildwheel
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install cibuildwheel and other dependencies
        run: python -m pip install cibuildwheel==2.22.0 build wheel setuptools twine

      # - name: Install LLVM (clang-cl) on windows
      #   run: choco install -y llvm
      #   if: runner.os == 'Windows'

      - name: Build sdist
        run: pipx run build --sdist --outdir wheelhouse
        if: runner.os == 'Windows'

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        # to supply options, put them in 'env', like:
        env:
          CIBW_ARCHS: auto64
          # CIBW_ARCHS_MACOS: "universal2"
          CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=11.0 CMAKE_BUILD_PARALLEL_LEVEL='1'
          CIBW_TEST_COMMAND: python -c "import teqp"
          CIBW_ENVIRONMENT_LINUX: CXXFLAGS='-fconcepts' CMAKE_BUILD_PARALLEL_LEVEL='1'
          CIBW_ENVIRONMENT_WINDOW: CMAKE_BUILD_PARALLEL_LEVEL='1'
          CIBW_BUILD_VERBOSITY_WINDOWS: 2
          CIBW_SKIP: "*pypy* *pp* *cp36* *cp37* *cp38* *musl*"

      - name: Check wheels
        run: python -m twine check wheelhouse/*.whl

      - name: Upload Files
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            ./wheelhouse/*.whl
            ./wheelhouse/*.tar.gz

  merge_wheels:
    runs-on: ubuntu-latest
    needs: build_wheels
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v4
        with:
          name: dist
          pattern: dist-*

  attach_to_release:
    name: Attach wheels to GitHub Release
    needs: [merge_wheels]
    runs-on: ubuntu-latest
    # Only attach when a tag matching v* is pushed.  CI on regular pushes
    # and PRs still builds and verifies the wheels but does not publish.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist

      - name: List downloaded artifacts
        run: ls -lh dist

      - name: Create release and attach wheels
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          tag_name: ${{ github.ref_name }}
          # If the release already exists (e.g. created manually with notes),
          # this updates it by attaching wheels.  Otherwise it creates one.
          fail_on_unmatched_files: true
          generate_release_notes: true
